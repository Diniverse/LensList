name: Discover and validate opportunities

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lenslist-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Discover candidates from trusted official sources
        run: python -m scripts.discover
      - name: Validate fees, dates and duplicates
        run: python -m scripts.validate
      - name: Run automated tests
        run: python -m unittest discover -s tests -v
      - name: Check automation health
        run: python -m scripts.healthcheck
      - name: Commit data changes
        run: |
          git config user.name "lenslist-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data logs
          git diff --cached --quiet || git commit -m "chore(data): refresh verified opportunities"
          git push
