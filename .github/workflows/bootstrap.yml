name: Bootstrap LensList source tree

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand the validated source package
        run: |
          tar --exclude='.github/workflows/*' -xzf lenslist-source.tar.gz
          rm lenslist-source.tar.gz
      - name: Commit application source
        run: |
          git config user.name "lenslist-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build complete automated LensList application"
          git push
